networks:
  zigbee:

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: Australia/Melbourne
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    ports:
      # Frontend port
      - 8085:8080
    environment:
      - TZ=Australia/Melbourne
    devices:
      # Make sure this matched your adapter location
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - dialout
    user: 1000:1000
    networks:
      - zigbee

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - zigbee

  music-assistant-server:
    image: ghcr.io/music-assistant/server:latest # <<< Desired release version here (or use beta to get the latest beta version)
    container_name: music-assistant-server
    restart: unless-stopped
    # Network mode must be set to host for MA to discover and stream to players (see networking note below)
    network_mode: host
    volumes:
      - ./data/music-assistant:/data/
    environment:
      # Provide logging level as environment variable.
      # default=info, possible=(critical, error, warning, info, debug)
      - LOG_LEVEL=info

  local-audio:
    image: ghcr.io/music-assistant/local-audio-addon:latest
    container_name: ma-local-audio
    restart: unless-stopped
    # Both halves of the player need the host's network namespace: mDNS to be
    # discovered, and port 8928 for the server to connect back in on.
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./data/local-audio-addon:/data
    environment:
      SENDSPIN_NAME: Server Speaker
      SENDSPIN_OUTPUT: alsa:plughw:CARD=Device,DEV=0
      SENDSPIN_LOG_LEVEL: info
