services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - TZ=Australia/Melbourne
      - GENERIC_TIMEZONE=Australia/Melbourne
      - N8N_SECURE_COOKIE=false

    volumes:
      - ./data:/home/node/.n8n
