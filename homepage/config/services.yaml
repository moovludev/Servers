---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- Private Services:
    - Szurubooru:
        icon: /icons/szurubooru.jpg
        href: http://192.168.20.30:8080
        siteMonitor: http://192.168.20.30:8080
        description: Image booru
        server: local-docker
        container: szurubooru-server-1
    - Ganymede:
        icon: /icons/ganymede.png
        href: http://192.168.20.30:4800
        siteMonitor: http://192.168.20.30:4800
        description: Twitch stream archive server
        server: local-docker
        container: ganymede
    - Jellyfin:
        icon: jellyfin.png
        href: http://192.168.20.30:8096
        description: Media server
        siteMonitor: http://192.168.20.30:8096
        widget:
            type: jellyfin
            url: http://192.168.20.30:8096
            key: {{HOMEPAGE_VAR_JELLYFIN_API}}
            enableBlocks: true # optional, defaults to false
            enableNowPlaying: true # optional, defaults to true
            enableUser: true # optional, defaults to false
            enableMediaControl: false # optional, defaults to true
            showEpisodeNumber: true # optional, defaults to false
            expandOneStreamToTwoRows: false # optional, defaults to true
        server: local-docker
        container: jellyfin
    - Gluetun:
        icon: gluetun.png
        description: VPN interface
        server: local-docker
        container: torrenting-stack-gluetun-1
    - Firefox:
        icon: firefox.png
        description: Web browser
        href: http://192.168.20.30:5800
        siteMonitor: http://192.168.20.30:5800
        server: local-docker
        container: torrenting-stack-firefox-1
    - qbittorrent:
        icon: qbittorrent.png
        description: Torrent client
        href: http://192.168.20.30:8081
        siteMonitor: http://192.168.20.30:8081
        server: local-docker
        container: qbittorrent
        widget:
            type: qbittorrent
            url: http://192.168.20.30:8081
            username: {{HOMEPAGE_VAR_QBITTORRENT_USER}}
            password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}
            enableLeechProgress: true # optional, defaults to false
            enableLeechSize: true # optional, defaults to false
    - syncthing:
        icon: syncthing.png
        description: File Syncing Tool
        href: http://192.168.20.30:8384
        siteMonitor: http://192.168.20.30:8384
        server: local-docker
        container: syncthing
    - homeassistant:
        icon: home-assistant.png
        description: A centralised home assistant
        href: http://192.168.20.30:8123
        siteMonitor: http://192.168.20.30:8123
        server: local-docker
        container: homeassistant
    - Explo:
        icon: explo.png
        description: Automatic listenbrainz downloader
        href: http://192.168.20.30:7288
        siteMonitor: http://192.168.20.30:7288
        server: local-docker
        container: explo
    - Zigbee2MQTT:
        icon: zigbee2mqtt.png
        description: Zigbee to MQTT bridge
        href: http://192.168.20.30:8085
        siteMonitor: http://192.168.20.30:8085
        server: local-docker
        container: zigbee2mqtt
    - Backrest:
        icon: backrest.png
        description: Restic backup wrapper
        href: http://192.168.20.30:9898
        siteMonitor: http://192.168.20.30:9898
        server: local-docker
        container: backrest
        widget:
          type: backrest
          url: http://192.168.20.30:9898
          username: {{HOMEPAGE_VAR_BACKREST_USER}}
          password: {{HOMEPAGE_VAR_BACKREST_PASSWORD}}
    - Seafile:
        icon: seafile.png
        description: File Server
        href: http://192.168.20.30:8086
        siteMonitor: http://192.168.20.30:8086
        server: local-docker
        container: seafile
    - Cloudflared:
        icon: cloudflared.png
        description: Tunnel to cloudflare domain
        server: local-docker
        container: cloudflared
    - Mindwtr:
        icon: mindwtr.png
        description: Tasks server
        href: http://192.168.20.30:5173
        siteMonitor: http://192.168.20.30:5173
        server: local-docker
        container: mindwtr-cloud
    - Scrutiny:
        icon: scrutiny.png
        description: Drive S.M.A.R.T checks
        href: http://192.168.20.30:8082
        siteMonitor: http://192.168.20.30:8082
        server: local-docker
        container: scrutiny
