            type: tailscale
            deviceid: {{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}
            key: {{HOMEPAGE_VAR_TAILSCALE_KEY}}
    - Azuracast:
        icon: azuracast.png
        href: {{HOMEPAGE_VAR_AZURACAST_PUBLIC}}
        description: Internet Radio
        server: local-docker
