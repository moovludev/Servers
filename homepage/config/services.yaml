          type: scrutiny
          url: http://192.168.20.30:8082
    - diun:
        icon: diun.png
        description: Docker image notifications
        server: local-docker
        container: diun
    - n8n:
        icon: n8n.png
        description: Workflow automation
        href: http://192.168.20.30:5678
        siteMonitor: http://192.168.20.30:5678
        server: local-docker
        container: n8n
    - crowdsec:
        icon: crowdsec.png
        description: IDS
        server: local-docker
        container: crowdsec

- Public Services:
    - Immich:
        icon: immich.png
        href: {{HOMEPAGE_VAR_IMMICH_PUBLIC}}
        siteMonitor: {{HOMEPAGE_VAR_IMMICH_PUBLIC}}
        description: Photo Server
        widget:
            type: immich
            url: http://192.168.20.30:2283
            key: {{HOMEPAGE_VAR_IMMICH_API}}
            version: 2 # optional, default is 1
        server: local-docker
        container: immich_server
    - Muse:
        icon: /icons/muse.png
        description: Discord music bot
        server: local-docker
        container: muse-discord-muse-1
    - Foundry:
        icon: /icons/foundry.png
        href: {{HOMEPAGE_VAR_FOUNDRY_PUBLIC}}
        description: Online D&D game server
